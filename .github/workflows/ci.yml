docker:
  runs-on: ubuntu-latest
  needs: test
  permissions:
    contents: read
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login Docker Hub
      run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

    - name: Build Symfony image
      run: |
        docker build \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/cat-symfony:latest \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/cat-symfony:${{ github.sha }} \
          ./symfony-api

    - name: Build Express image
      run: |
        docker build \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/cat-express:latest \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/cat-express:${{ github.sha }} \
          ./express-app

    - name: Push Symfony image
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/cat-symfony:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/cat-symfony:${{ github.sha }}

    - name: Push Express image
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/cat-express:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/cat-express:${{ github.sha }}