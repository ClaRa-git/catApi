name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- PHP / Symfony ----------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Create Symfony .env
        working-directory: symfony-api
        run: |
          cp .env.dev .env

      - name: Install Symfony deps
        working-directory: symfony-api
        run: composer install --no-interaction --prefer-dist

      - name: Run Symfony tests
        working-directory: symfony-api
        run: php bin/phpunit

      # ---------- Node / Express ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Express deps
        working-directory: express-app
        run: npm install

      - name: Run Express tests
        working-directory: express-app
        run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: check credentials
        run: echo "DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}"

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin


      - name: Build Symfony image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cat-symfony:latest ./symfony-api

      - name: Build Express image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cat-express:latest ./express-app

      - name: Push Symfony image
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/cat-symfony:latest ${{ secrets.DOCKERHUB_USERNAME }}/cat-symfony:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cat-symfony:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cat-symfony:${{ github.sha }}

      - name: Push Express image
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/cat-express:latest ${{ secrets.DOCKERHUB_USERNAME }}/cat-express:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cat-express:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cat-express:${{ github.sha }}